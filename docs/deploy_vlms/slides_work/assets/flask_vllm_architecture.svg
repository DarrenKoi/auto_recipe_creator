<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <style>
      .title { font: 700 34px 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif; fill: #1f2933; }
      .label { font: 700 21px 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif; fill: #1f2933; }
      .body { font: 500 19px 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif; fill: #334e68; }
      .small { font: 500 16px 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif; fill: #52606d; }
      .mono { font: 600 16px 'Menlo', 'Consolas', monospace; fill: #102a43; }
      .panel { fill: #fffdf8; stroke: #d9d0c3; stroke-width: 2; rx: 24; }
      .accent { fill: #f8e2c2; }
      .teal { fill: #d8eff0; }
      .rust { fill: #f5d7ca; }
      .green { fill: #ddeee0; }
      .line { stroke: #7b8794; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .dash { stroke: #9fb3c8; stroke-width: 3; fill: none; stroke-dasharray: 10 10; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1536" height="1024" fill="#f5efe6"/>
  <rect x="54" y="54" width="1428" height="916" rx="34" fill="#f8f4ec" stroke="#eadfce" stroke-width="3"/>
  <text x="88" y="112" class="title">Flask proxy + vLLM deployment path</text>

  <rect x="88" y="160" width="262" height="150" rx="24" class="panel accent"/>
  <text x="118" y="210" class="label">Operators</text>
  <text x="118" y="246" class="body">Manual start / stop</text>
  <text x="118" y="276" class="body">Health checks</text>

  <rect x="88" y="338" width="262" height="150" rx="24" class="panel accent"/>
  <text x="118" y="388" class="label">Coworkers</text>
  <text x="118" y="424" class="body">Shared gateway URL</text>
  <text x="118" y="454" class="mono">/api/vlm_serve/&lt;service&gt;</text>

  <rect x="88" y="516" width="262" height="220" rx="24" class="panel accent"/>
  <text x="118" y="566" class="label">poc/work clients</text>
  <text x="118" y="602" class="body">OpenAI-compatible caller</text>
  <text x="118" y="636" class="mono">VLM_API_URL</text>
  <text x="118" y="666" class="mono">VLM_MODEL_NAME</text>
  <text x="118" y="708" class="small">list_up_tools.py,</text>
  <text x="118" y="734" class="small">vlm_screen_analysis.py,</text>
  <text x="118" y="760" class="small">vlm_openai_client.py</text>

  <rect x="410" y="194" width="348" height="480" rx="28" class="panel"/>
  <rect x="438" y="228" width="292" height="88" rx="18" class="teal"/>
  <text x="468" y="284" class="label">Flask app</text>
  <text x="468" y="316" class="small">web_main.py -&gt; register_flask_api(app)</text>

  <rect x="438" y="344" width="292" height="118" rx="18" class="panel"/>
  <text x="468" y="390" class="label">API root</text>
  <text x="468" y="424" class="mono">/api</text>
  <text x="468" y="452" class="small">/api/health returns nested VLM health</text>

  <rect x="438" y="484" width="292" height="154" rx="18" class="panel"/>
  <text x="468" y="530" class="label">vlm_serve package</text>
  <text x="468" y="564" class="mono">/api/vlm_serve/&lt;service&gt;/v1/*</text>
  <text x="468" y="594" class="body">Proxy forces non-streaming</text>
  <text x="468" y="624" class="body">Health probes /v1/models</text>

  <rect x="820" y="160" width="286" height="576" rx="28" class="panel"/>
  <text x="850" y="214" class="label">Proxy service slugs</text>
  <rect x="848" y="248" width="230" height="84" rx="18" class="rust"/>
  <text x="880" y="298" class="mono">ui-venus</text>
  <text x="880" y="324" class="small">display: UI-Venus-1.5-8B</text>

  <rect x="848" y="352" width="230" height="84" rx="18" class="rust"/>
  <text x="880" y="402" class="mono">mai-ui</text>
  <text x="880" y="428" class="small">display: MAI-UI-8B</text>

  <rect x="848" y="456" width="230" height="84" rx="18" class="rust"/>
  <text x="880" y="506" class="mono">ui-tars</text>
  <text x="880" y="532" class="small">display: UI-TARS-1.5-7B</text>

  <rect x="848" y="560" width="230" height="118" rx="18" class="rust"/>
  <text x="880" y="610" class="mono">paddleocr-vl-1.5</text>
  <text x="880" y="638" class="small">display: PaddleOCR-VL-1.5</text>
  <text x="880" y="666" class="small">vLLM path, canary port</text>

  <rect x="1160" y="160" width="286" height="576" rx="28" class="panel"/>
  <text x="1190" y="214" class="label">Upstream model processes</text>
  <rect x="1188" y="248" width="230" height="78" rx="18" class="green"/>
  <text x="1220" y="296" class="mono">:8001 ui-venus-1.5-8b</text>
  <rect x="1188" y="340" width="230" height="78" rx="18" class="green"/>
  <text x="1220" y="388" class="mono">:8002 mai-ui-8b</text>
  <rect x="1188" y="432" width="230" height="78" rx="18" class="green"/>
  <text x="1220" y="480" class="mono">:8003 ui-tars-1.5-7b</text>
  <rect x="1188" y="524" width="230" height="78" rx="18" class="green"/>
  <text x="1220" y="572" class="mono">:8004 paddleocr-vl-1.5</text>
  <text x="1188" y="632" class="body">serve_vlm.py launches</text>
  <text x="1188" y="662" class="body">vllm.entrypoints.openai.api_server</text>
  <text x="1188" y="702" class="small">MODEL_ID points to local</text>
  <text x="1188" y="728" class="small">/project/.../data/models/*</text>

  <rect x="410" y="760" width="704" height="154" rx="28" class="panel"/>
  <text x="440" y="812" class="label">Config and start pipeline</text>
  <text x="440" y="850" class="mono">config/common.env + config/models/*.env</text>
  <text x="440" y="882" class="body">start_ui_venus.py / start_mai_ui.py / start_model.py -&gt; serve_vlm.py</text>
  <text x="440" y="910" class="small">common.env sets offline defaults, model env files override port / GPU / alias / chat template</text>

  <rect x="1160" y="760" width="286" height="154" rx="28" class="panel"/>
  <text x="1190" y="812" class="label">Separate OCR path</text>
  <text x="1190" y="850" class="mono">GOT-OCR-2.0-hf</text>
  <text x="1190" y="882" class="body">run_got_ocr.py</text>
  <text x="1190" y="910" class="small">transformers direct runtime first, API wrapper later</text>

  <path d="M 350 235 C 386 235, 388 235, 410 235" class="line"/>
  <path d="M 350 415 C 386 415, 388 415, 410 415" class="line"/>
  <path d="M 350 626 C 386 626, 388 626, 410 626" class="line"/>
  <path d="M 758 560 C 790 560, 792 560, 820 560" class="line"/>
  <path d="M 1106 290 C 1134 290, 1138 290, 1160 290" class="line"/>
  <path d="M 1106 392 C 1134 392, 1138 392, 1160 392" class="line"/>
  <path d="M 1106 498 C 1134 498, 1138 498, 1160 498" class="line"/>
  <path d="M 1106 618 C 1134 618, 1138 618, 1160 618" class="line"/>
  <path d="M 760 824 C 760 770, 942 770, 942 736" class="dash"/>
  <path d="M 1300 736 C 1300 748, 1300 748, 1300 760" class="dash"/>
</svg>
