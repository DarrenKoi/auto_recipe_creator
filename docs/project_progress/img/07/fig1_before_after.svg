<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Apple SD Gothic Neo, Malgun Gothic, NanumGothic, sans-serif">
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="960" y="66" text-anchor="middle" font-size="38" font-weight="700" fill="#111827">Before / After : 1건 5분 걸리던 Align Fail 대응이 AI Agent 루프에서 1분 미만으로</text>

  <!-- ===== BEFORE ===== -->
  <rect x="40" y="110" width="1840" height="320" rx="16" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="64" y="215" font-size="46" font-weight="700" fill="#374151">Before</text>
  <text x="64" y="258" font-size="22" fill="#4b5563">현업 담당자가</text>
  <text x="64" y="290" font-size="22" fill="#4b5563">전 과정 수행</text>

  <g font-size="30" font-weight="700" fill="#111827" text-anchor="middle">
    <rect x="330"  y="150" width="280" height="150" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.4"/>
    <text x="470"  y="215">24시간 감시</text>
    <text x="470"  y="262" font-size="20" font-weight="400" fill="#6b7280">교대로 화면 지켜봄</text>

    <rect x="646"  y="150" width="280" height="150" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.4"/>
    <text x="786"  y="215">수동 접속</text>
    <text x="786"  y="262" font-size="20" font-weight="400" fill="#6b7280">RCS 로그인·장비 탐색</text>

    <rect x="962"  y="150" width="280" height="150" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.4"/>
    <text x="1102" y="215">육안 탐색·재조정</text>
    <text x="1102" y="262" font-size="20" font-weight="400" fill="#6b7280">배율 바꿔가며 Key 찾기</text>

    <rect x="1278" y="150" width="280" height="150" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2.4" stroke-dasharray="10 7"/>
    <text x="1418" y="215">확정</text>
    <text x="1418" y="262" font-size="20" font-weight="400" fill="#b91c1c">기록 없음</text>
  </g>
  <g stroke="#6b7280" stroke-width="2.4" fill="#6b7280">
    <path d="M610 225 L630 225"/><path d="M626 216 L646 225 L626 234 Z"/>
    <path d="M926 225 L946 225"/><path d="M942 216 L962 225 L942 234 Z"/>
    <path d="M1242 225 L1262 225"/><path d="M1258 216 L1278 225 L1258 234 Z"/>
  </g>
  <rect x="1600" y="150" width="280" height="150" rx="12" fill="#374151"/>
  <text x="1740" y="230" text-anchor="middle" font-size="60" font-weight="700" fill="#ffffff">5분 / 건</text>
  <text x="1740" y="275" text-anchor="middle" font-size="22" fill="#d1d5db">주 400~500건 · 장비 idle</text>
  <text x="944" y="370" text-anchor="middle" font-size="24" fill="#b91c1c">병목 : 확인 주기 · 매 건 반복 조작 · 숙련도 편차 · 기록 없음</text>

  <!-- ===== transition ===== -->
  <rect x="640" y="462" width="640" height="52" rx="26" fill="#dbeafe"/>
  <text x="960" y="497" text-anchor="middle" font-size="26" font-weight="700" fill="#1d4ed8">AI Agent 도입 : VLM · OCR · CV 역할 분리</text>
  <path d="M960 516 L960 528"/><path d="M948 526 L960 542 L972 526 Z" fill="#2563eb"/>

  <!-- ===== AFTER ===== -->
  <rect x="40" y="546" width="1840" height="430" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="651" font-size="46" font-weight="700" fill="#1e3a8a">After</text>
  <text x="64" y="694" font-size="22" fill="#1e40af">AI Agent 가</text>
  <text x="64" y="726" font-size="22" fill="#1e40af">자동 수행</text>

  <g font-size="30" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    <rect x="330"  y="586" width="280" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.8"/>
    <text x="470"  y="651">알람 감지</text>
    <text x="470"  y="698" font-size="20" font-weight="400" fill="#374151">10초 폴링 · 자동 발동</text>

    <rect x="646"  y="586" width="280" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.8"/>
    <text x="786"  y="651">자동 접속</text>
    <text x="786"  y="698" font-size="20" font-weight="400" fill="#374151">VLM 좌표 + OCR 확인</text>

    <rect x="962"  y="586" width="280" height="150" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.8"/>
    <text x="1102" y="651" fill="#047857">자동 재정렬</text>
    <text x="1102" y="698" font-size="20" font-weight="400" fill="#374151">CV 매칭으로 좌표 결정</text>

    <rect x="1278" y="586" width="280" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.8"/>
    <text x="1418" y="651">확정·기록</text>
    <text x="1418" y="698" font-size="20" font-weight="400" fill="#374151">담당자 OK · 기록 1줄</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.4" fill="#2563eb">
    <path d="M610 661 L630 661"/><path d="M626 652 L646 661 L626 670 Z"/>
    <path d="M926 661 L946 661"/><path d="M942 652 L962 661 L942 670 Z"/>
    <path d="M1242 661 L1262 661"/><path d="M1258 652 L1278 661 L1258 670 Z"/>
  </g>
  <rect x="1600" y="586" width="280" height="150" rx="12" fill="#1d4ed8"/>
  <text x="1740" y="666" text-anchor="middle" font-size="56" font-weight="700" fill="#ffffff">1분 미만</text>
  <text x="1740" y="711" text-anchor="middle" font-size="22" fill="#bfdbfe">감지~재조정 · 실알람 3건</text>

  <!-- exception strip -->
  <g stroke="#dc2626" stroke-width="2.4" fill="#dc2626">
    <path d="M1102 740 L1102 766 L470 766 L470 772" fill="none"/><path d="M461 770 L470 790 L479 770 Z"/>
  </g>
  <text x="64" y="855" font-size="26" font-weight="700" fill="#b91c1c">예외 시</text>
  <g font-size="24" font-weight="700" text-anchor="middle">
    <rect x="330"  y="796" width="280" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.4"/>
    <text x="470"  y="838" fill="#b91c1c">AI 가 물러남</text>
    <text x="470"  y="872" font-size="18" font-weight="400" fill="#7f1d1d">추측해서 누르지 않음</text>

    <rect x="646"  y="796" width="280" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.4"/>
    <text x="786"  y="838" fill="#6d28d9">큐브 알림</text>
    <text x="786"  y="872" font-size="18" font-weight="400" fill="#4c1d95">원인 + 요구 행동 자동 발송</text>

    <rect x="962"  y="796" width="280" height="100" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.4"/>
    <text x="1102" y="838" fill="#c2410c">담당자 조치</text>
    <text x="1102" y="872" font-size="18" font-weight="400" fill="#7c2d12">수동 정렬 · AI 는 관전</text>

    <rect x="1278" y="796" width="280" height="100" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.4"/>
    <text x="1418" y="838" fill="#1d4ed8">기록 → 다음 알람</text>
    <text x="1418" y="872" font-size="18" font-weight="400" fill="#374151">24시간 무인 반복</text>
  </g>
  <g stroke="#7c3aed" stroke-width="2.4" fill="#7c3aed">
    <path d="M610 846 L630 846"/><path d="M626 837 L646 846 L626 855 Z"/>
  </g>
  <g stroke="#ea580c" stroke-width="2.4" fill="#ea580c">
    <path d="M926 846 L946 846"/><path d="M942 837 L962 846 L942 855 Z"/>
    <path d="M1242 846 L1262 846"/><path d="M1258 837 L1278 846 L1258 855 Z"/>
  </g>
  <text x="944" y="946" text-anchor="middle" font-size="22" fill="#1e3a8a">안전 원칙 : 확인 안 된 클릭은 나가지 않는다 · 담당자가 개입하면 자동화가 양보 · 긴급 중단 단축키</text>

  <text x="960" y="1030" text-anchor="middle" font-size="18" fill="#6b7280">회색 = 담당자 수행 · 파랑 = 시스템 자동 수행 (VLM·OCR 판단 포함) · 초록 = CV 매칭 엔진이 좌표 결정</text>
</svg>
