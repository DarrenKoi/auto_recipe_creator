<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Apple SD Gothic Neo, Malgun Gothic, NanumGothic, sans-serif">
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">그림 3. 무엇이 얼마나 바뀌었나</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#4b5563">[검증] = 벤치·테스트·실알람으로 측정한 값    [목표] = 측정값을 주 400건에 적용한 환산값</text>

  <!-- Panel A: response time -->
  <rect x="24" y="84" width="368" height="360" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="208" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">1건당 대응 시간 (감지 → 위치 재조정)</text>
  <rect x="290" y="126" width="56" height="20" rx="10" fill="#dcfce7"/><text x="318" y="140" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">[검증]</text>
  <!-- axis base y=380, max height 220 for 5min -->
  <line x1="60" y1="380" x2="360" y2="380" stroke="#9ca3af"/>
  <rect x="96"  y="160" width="90" height="220" fill="#9ca3af"/>
  <text x="141" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#374151">5분</text>
  <text x="141" y="402" text-anchor="middle" font-size="13" fill="#374151">Before · 사람</text>
  <rect x="236" y="336" width="90" height="44" fill="#2563eb"/>
  <text x="281" y="326" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">&lt; 1분</text>
  <text x="281" y="402" text-anchor="middle" font-size="13" fill="#1d4ed8">After · AI Agent</text>
  <text x="208" y="430" text-anchor="middle" font-size="12.5" fill="#4b5563">감지 → 위치 재조정 구간 · 실알람 3건 · 확정 대기·측정 재개 제외</text>

  <!-- Panel B: rank-1 accuracy -->
  <rect x="416" y="84" width="368" height="360" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="600" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">정렬 위치 1순위 적중률 (rank-1)</text>
  <rect x="700" y="126" width="56" height="20" rx="10" fill="#dcfce7"/><text x="728" y="140" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">[검증]</text>
  <!-- scale: 1.0 = 220px -->
  <line x1="452" y1="380" x2="752" y2="380" stroke="#9ca3af"/>
  <line x1="452" y1="160" x2="752" y2="160" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <text x="448" y="164" text-anchor="end" font-size="11" fill="#9ca3af">100%</text>
  <rect x="488" y="310" width="90" height="70" fill="#9ca3af"/>
  <text x="533" y="300" text-anchor="middle" font-size="20" font-weight="700" fill="#374151">31.8%</text>
  <text x="533" y="402" text-anchor="middle" font-size="13" fill="#374151">등록 이미지 1장</text>
  <rect x="628" y="212" width="90" height="168" fill="#059669"/>
  <text x="673" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#047857">76.4%</text>
  <text x="673" y="402" text-anchor="middle" font-size="13" fill="#047857">성공 사례 종합(consensus)</text>
  <rect x="560" y="236" width="80" height="24" rx="12" fill="#ecfdf5" stroke="#059669"/>
  <text x="600" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">× 2.4</text>
  <text x="600" y="430" text-anchor="middle" font-size="12.5" fill="#4b5563">Recipe 200개 오프라인 벤치 · 후보 포함률 43.4% → 87.6%</text>

  <!-- Panel C: weekly idle hours -->
  <rect x="808" y="84" width="368" height="360" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="992" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">주당 장비 idle 시간 (400건 기준)</text>
  <rect x="836" y="126" width="56" height="20" rx="10" fill="#fef3c7"/><text x="864" y="140" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">[목표]</text>
  <!-- scale: 33h = 220px -> 6.67px/h -->
  <line x1="844" y1="380" x2="1144" y2="380" stroke="#9ca3af"/>
  <rect x="880" y="160" width="90" height="220" fill="#9ca3af"/>
  <text x="925" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#374151">약 33시간</text>
  <text x="925" y="402" text-anchor="middle" font-size="13" fill="#374151">Before · 400건 × 5분</text>
  <!-- after: 6.7h = 44px; recovered 27h drawn as hatched outline -->
  <rect x="1020" y="160" width="90" height="176" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="1020" y="336" width="90" height="44" fill="#2563eb"/>
  <text x="1065" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">약 6.7시간</text>
  <text x="1065" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">회수</text>
  <text x="1065" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">약 27시간/주</text>
  <text x="1065" y="402" text-anchor="middle" font-size="13" fill="#1d4ed8">After · 400건 × 1분 (가정)</text>
  <text x="992" y="430" text-anchor="middle" font-size="12.5" fill="#4b5563">≈ WAFER 약 100장/주 (장당 15분) · 연 약 5,000장 (50주) · 전 건 동일 단축 가정</text>

  <text x="600" y="462" text-anchor="middle" font-size="12" fill="#6b7280">그 외 [검증]: 좌표 인식+클릭 500회 99% · 버튼 판독 100% (클릭 미실행 벤치) · VLM·OCR 5종 비교 평가 → 2종 상시 운영</text>
</svg>
