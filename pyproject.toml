[project]
name = "auto-recipe-creator"
version = "0.1.0"
description = "AI-powered automation system for CD-SEM/VeritySEM recipe setup"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "mss>=9.0.0",
    "pynput>=1.7.6",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "opencv-contrib-python>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-pptx>=0.6.21",
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    # RCS 프로세스 조회(open_rcs.find_existing_rcs_processes). 없으면 "안 돌고 있음" 과
    # "알 수 없음" 이 구분되지 않아 중복 실행 가드가 조용히 무력화된다.
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
# Office COM 자동화 (Windows 전용). 다른 플랫폼에서는 설치하지 않는다.
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "xlwings>=0.31.0; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poc", "test", "flask_api", "gpu_dashboard"]

[tool.pytest.ini_options]
pythonpath = [".", "test"]
